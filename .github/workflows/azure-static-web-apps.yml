name: Quasaric - Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy Quasaric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Verify Azure configuration
        run: |
          test -f dist/staticwebapp.config.json
          echo "Azure configuration found in dist"

      # Main publishes production. Pull requests publish isolated Azure preview environments.
      - name: Deploy production or PR preview to Azure Static Web Apps
        if: github.event.action != 'closed' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_04BD1081E }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true

      # Remove the isolated preview when the pull request is closed.
      - name: Close PR preview environment
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MEADOW_04BD1081E }}
          action: close